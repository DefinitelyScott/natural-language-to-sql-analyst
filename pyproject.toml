[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-analyst"
version = "0.1.0"
description = "A natural-language-to-SQL analytics assistant with an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=2.3"]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A deliberately curated set rather than ALL: each family here catches a class
# of defect this codebase actually contains guards against (unused arguments in
# protocol impls, blind excepts, private-member access), so a violation is
# signal, not noise. The inline `noqa` codes that predate this config (E402,
# BLE001, ARG002, SLF001) are load-bearing under exactly these families.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort import ordering
    "UP",  # pyupgrade (keep syntax at the 3.10 floor, no older idioms)
    "B",   # bugbear (e.g. zip() without strict=, mutable default args)
    "ARG", # unused function/method/lambda arguments
    "BLE", # blind `except Exception` without a reason
    "SLF", # private-member access across module boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into internals (that is what they test) and define
# stubs/mocks that take a protocol's full signature without consulting it.
"tests/*" = ["SLF001", "ARG"]

[tool.mypy]
python_version = "3.10"
# Strict, and applied to the shipped code only — `nl2sql/`, `evals/` and
# `scripts/`, which is what CI checks. Two deliberate boundaries:
#
# * Strict rather than a subset. The codebase was already almost fully
#   annotated, so the cost of turning everything on was small and the findings
#   were real: `RepairingBackend` did not declare the `to_sql` its only holder
#   calls, and the sample-DB builder's row lists were inferred from their first
#   append rather than stated. A permissive baseline would have reported
#   neither.
# * `tests/` is excluded. Test doubles exist to implement one method of a
#   protocol and stub the rest, and `--strict` would demand full annotations on
#   every fixture and mock — noise on code whose contract is the assertion it
#   makes, not its signature. The suite still type-checks the package
#   transitively, since it imports and exercises it.
strict = true
files = ["nl2sql", "evals", "scripts"]

[[tool.mypy.overrides]]
# `openai` is an optional extra: the LLM backend imports it lazily inside the
# constructor so the offline path never needs it, and CI does not install it.
# Without this the type check would fail on a missing stub for a dependency
# that is *meant* to be absent. Scoped to this one module so a genuinely
# missing import anywhere else is still an error.
module = ["openai"]
ignore_missing_imports = true
