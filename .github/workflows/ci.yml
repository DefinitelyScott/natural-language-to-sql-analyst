name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so a new ruff release adding rules cannot break CI on an
        # unrelated commit; bump deliberately alongside any needed fixes.
        run: pip install ruff==0.16.2
      - name: Lint
        run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The oldest interpreter the project supports, matching
          # `python_version` in the mypy config: checking against the floor is
          # what catches a syntax or typing feature that only exists on newer
          # versions.
          python-version: "3.10"
      - name: Install mypy
        # Pinned for the same reason ruff is — a new release adding checks
        # would otherwise fail CI on a commit that changed nothing.
        run: pip install mypy==2.3.1
      - name: Type check
        # Paths, strictness and the `openai` exemption all live in
        # pyproject.toml, so this runs the same check a contributor gets from a
        # bare `mypy`. `openai` is deliberately not installed here: the offline
        # path must type-check without it.
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest
      - name: Build sample database
        run: python scripts/build_sample_db.py
      - name: Run tests
        run: pytest -q
      - name: Run evaluation harness (offline backend)
        run: python evals/evaluate.py
